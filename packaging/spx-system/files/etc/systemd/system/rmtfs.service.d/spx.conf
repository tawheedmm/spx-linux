# Surface Pro X (spx-system): Windows-on-ARM laptops have no modemst1/modemst2/fsg partitions.
# Ubuntu's unit runs "rmtfs -r -P -s" (partitions) and the modem (MPSS) crash-loops. Serve the
# modem's EFS requests from blank image files in /var/lib/rmtfs instead (-o), read-only (-r).
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -r -s -o /var/lib/rmtfs
