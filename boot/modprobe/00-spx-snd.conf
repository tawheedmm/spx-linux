# Surface Pro X: alsa-base's "install snd" hook ends with "modprobe snd-seq", which fails on
# kernels built without CONFIG_SND_SEQUENCER and makes systemd-modules-load.service fail on
# snd-soc-sdm845 (system state "degraded"). This file sorts before alsa-base.conf, so it wins.
# Not needed once the kernel has SND_SEQUENCER (added to scripts/spx-cambria.config 2026-11-13).
install snd /sbin/modprobe --ignore-install snd $CMDLINE_OPTS && { /sbin/modprobe --quiet --use-blacklist snd-seq ; : ; }
