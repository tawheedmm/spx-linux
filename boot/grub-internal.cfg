set timeout=5
set default=0
insmod part_gpt
insmod fat
search --no-floppy --file /EFI/spx/grub.cfg --set=root
set spx=/EFI/spx

# One-shot entry (written by spx-boot-once): boot it once, then clear it.
if [ -f $spx/grubenv ]; then
    load_env --file $spx/grubenv next_entry
    if [ -n "$next_entry" ]; then
        set default="$next_entry"
        set next_entry=
        save_env --file $spx/grubenv next_entry
    fi
fi

set common="root=PARTLABEL=spx-root-nvme rw rootwait efi=novamap clk_ignore_unused pd_ignore_unused earlycon=efifb console=tty0 loglevel=7 ignore_loglevel printk.devkmsg=on deferred_probe_timeout=60"

menuentry "SPX Linux" {
    devicetree $spx/dtbs/qcom/sc8180x-microsoft-cambria.dtb
    linux $spx/vmlinuz $common
    initrd $spx/initrd.img
}
menuentry "SPX Linux (safe mode: no GPU/touch/keyboard-cover/DSP drivers)" {
    devicetree $spx/dtbs/qcom/sc8180x-microsoft-cambria.dtb
    linux $spx/vmlinuz $common loglevel=8 initcall_debug modprobe.blacklist=msm,spi_hid_of,spi_hid,surface_aggregator,qcom_q6v5_pas systemd.unit=multi-user.target
    initrd $spx/initrd.img
}
menuentry "Windows" {
    search --no-floppy --file /EFI/Microsoft/Boot/bootmgfw.efi --set=root
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry "UEFI firmware settings" {
    fwsetup
}
