set timeout=5
set default=0
insmod part_gpt
insmod fat
search --no-floppy --file /EFI/spx/grub.cfg --set=root
set spx=/EFI/spx

# One-shot entry (written by spx-boot-once): boot it once, then clear it.
if [ -f $spx/grubenv ]; then
    load_env --file $spx/grubenv next_entry
    if [ -n "$next_entry" ]; then
        set default="$next_entry"
        set next_entry=
        save_env --file $spx/grubenv next_entry
    fi
fi

set common="root=PARTLABEL=spx-root-nvme rw rootwait efi=novamap clk_ignore_unused pd_ignore_unused earlycon=efifb console=tty0 loglevel=7 ignore_loglevel printk.devkmsg=on deferred_probe_timeout=60"

# Default: $common without pd_ignore_unused, plus fw_devlink.sync_state=timeout (gcc/gpucc never
# reach sync_state because of the GMU, so unused power domains would otherwise stay on in suspend)
# and ssbd=force-on (without it every kernel entry on cpu4-7 makes two firmware calls for the
# Spectre-v4 mitigation: system calls cost 17 us instead of 0.26 us and boot takes 25 s longer).
# Kernel: perf build (zram + MGLRU) with "PCI: qcom: Do not advertise hot-plug without the global
# interrupt". See docs/workstreams/suspend.md and docs/workstreams/performance.md.
menuentry "SPX Linux" {
    devicetree $spx/dtbs/qcom/sc8180x-microsoft-cambria.dtb
    linux $spx/vmlinuz root=PARTLABEL=spx-root-nvme rw rootwait efi=novamap clk_ignore_unused earlycon=efifb console=tty0 loglevel=7 ignore_loglevel printk.devkmsg=on deferred_probe_timeout=60 fw_devlink.sync_state=timeout ssbd=force-on
    initrd $spx/initrd.img
}
# The default before the perf promotion, with the command line it had then.
menuentry "SPX Linux (previous kernel)" {
    devicetree $spx/dtbs/qcom/sc8180x-microsoft-cambria-prev.dtb
    linux $spx/vmlinuz-prev root=PARTLABEL=spx-root-nvme rw rootwait efi=novamap clk_ignore_unused earlycon=efifb console=tty0 loglevel=7 ignore_loglevel printk.devkmsg=on deferred_probe_timeout=60 fw_devlink.sync_state=timeout
    initrd $spx/initrd-prev.img
}
# One generation further back; lives on the root filesystem because the ESP holds two kernels.
menuentry "SPX Linux (older kernel)" {
    insmod ext2
    search --no-floppy --file /boot/older/vmlinuz --set=root
    devicetree /boot/older/sc8180x-microsoft-cambria.dtb
    linux /boot/older/vmlinuz $common
    initrd /boot/older/initrd.img
}
menuentry "SPX Linux (safe mode: no GPU/touch/keyboard-cover/DSP drivers)" {
    devicetree $spx/dtbs/qcom/sc8180x-microsoft-cambria.dtb
    linux $spx/vmlinuz $common loglevel=8 initcall_debug modprobe.blacklist=msm,spi_hid_of,spi_hid,surface_aggregator,qcom_q6v5_pas systemd.unit=multi-user.target
    initrd $spx/initrd.img
}
menuentry "Windows" {
    search --no-floppy --file /EFI/Microsoft/Boot/bootmgfw.efi --set=root
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry "UEFI firmware settings" {
    fwsetup
}
